[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-teleportation-protocol"
version = "2.0.0"
description = "Three-Qubit Quantum Teleportation & Bell State Measurement Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.20,<1", "pydantic>=2,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["quantum_teleportation", "agents"]
py-modules = ["cli", "enrichment", "simulator", "quantum_teleportation_app"]

[project.scripts]
quantum-teleportation-protocol = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-teleportation-protocol"
Repository = "https://github.com/abusuraihsakhri/quantum-teleportation-protocol.git"
